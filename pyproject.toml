[project]
name = "dual-tmux"
version = "0.4.69"
description = "Dual tmux tunnels: op_* line head + run_* workspace jump, 1:1 dt-* binding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=43.0",
    "lark-oapi>=1.4.18",
    "pydantic>=2,<3",
    "rich>=13.0",
    "segno>=1.6",
]

[project.scripts]
dt = "dual_tmux.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dual_tmux", "datanode"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
