[project]
name = "dual-tmux"
version = "0.1.8"
description = "Dual tmux tunnels: op_* line head + run_* workspace jump, 1:1 dt-* binding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dt = "dual_tmux.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dual_tmux"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
